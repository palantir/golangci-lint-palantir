version: "2"

linters:
  default: none

  settings:
    custom:
      safelogging:
        type: module
        description: A linter that verifies that information that is logged is safe to log.
    revive:
      rules:
        - name: package-comments
          disabled: true

  # opinionated set of defaults: golangci-lint defaults + revive and unconvert
  enable:
    - errcheck
    - govet
    - ineffassign
    - revive
    - unconvert
    - unused

  exclusions:
    rules:
      # ignores a warning produced by the experimental govet inline analyzer
      - text: "inline: cannot inline: type parameter inference is not yet supported"
        linters:
          - govet

run:
  relative-path-mode: gomod
