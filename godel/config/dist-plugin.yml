products:
  golangci-lint-palantir:
    dist:
      disters:
        type: golangci-lint
        config:
          # specifies the version of golangci-lint that is used as a base to build golangci-lint-palantir.
          # The "generate" godel task keeps this in sync with the version of the "github.com/golangci/golangci-lint/v2"
          # module specified by the "require" directive in the "go.mod" of this project.
          golangci-lint-version: v2.13.2
          os-archs:
            - os: darwin
              arch: amd64
            - os: darwin
              arch: arm64
            - os: linux
              arch: amd64
            - os: linux
              arch: arm64
          environment:
            CGO_ENABLED: "0"
            GOFLAGS: "-mod=readonly"
          plugins:
            - module: github.com/palantir/safe-logging-go
              import: github.com/palantir/safe-logging-go/golangcilint/safelogging
              version: v0.11.0
    publish: {}
  golangci-lint-palantir-config:
    dist:
      disters:
        golangci-lint-config:
          type: manual
          config:
            extension: yml.tgz
          script: |
            #!/bin/bash
            cp "${PROJECT_DIR}/pluginconfig/golangci.yml" "${DIST_WORK_DIR}/${PRODUCT}-${VERSION}.yml"

            tar -czvf "${DIST_DIR}/${PRODUCT}-${VERSION}.yml.tgz" -C "${DIST_WORK_DIR}" "${PRODUCT}-${VERSION}.yml"
    publish: {}
product-defaults:
  publish:
    group-id: com.palantir.golangci-lint-palantir
